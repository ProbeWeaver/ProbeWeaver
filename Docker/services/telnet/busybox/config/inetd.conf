# busybox inetd: spawn one short-lived `telnetd -i` per incoming connection
# (nowait = fork per connection, handled in parallel). This avoids the single
# long-running `telnetd -F` process serializing connection setup, which made a
# burst of connections drain over ~30s and left the service silent for 20s+
# afterwards (flagged DEGRADED under stress). With inetd each connection is an
# independent process, so floods are served in parallel and recovery is instant.
23 stream tcp nowait root telnetd telnetd -i -l /bin/sh
