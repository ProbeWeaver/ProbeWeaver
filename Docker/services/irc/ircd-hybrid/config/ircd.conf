/* Minimal ircd-hybrid configuration for protocol fingerprinting.
 * Classic ircd lineage: its CAP / 005 ISUPPORT output differs from ngIRCd
 * and InspIRCd. */

serverinfo {
    name = "irc.hybrid.example";
    sid = "0HY";
    description = "ircd-hybrid fingerprint variant";
    network_name = "HybridNet";
    network_desc = "Protocol Fingerprinting Research";
    hub = no;
    default_max_clients = 1000;
};

listen {
    port = 6667;
    host = "0.0.0.0";
};

class {
    name = "users";
    ping_time = 90 seconds;
    number_per_ip = 200;
    max_number = 1000;
    sendq = 100 kbytes;
};

auth {
    user = "*@*";
    class = "users";
};

channel {
    disable_local_channels = no;
    knock_delay = 5 minutes;
    max_chans_per_user = 25;
};

general {
    throttle_count = 100;
    anti_spam_exit_message_time = 1 minute;
    disable_auth = yes;
    disable_dns = yes;
};
