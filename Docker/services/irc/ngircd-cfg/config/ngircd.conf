# ngIRCd configuration variant: different server identity and limits, which
# changes the 005 ISUPPORT tokens and registration banner compared with the
# baseline ngircd service.

[GLOBAL]
    Name = ircd.altnet.example
    AdminInfo1 = Alt IRC Server
    AdminInfo2 = Fingerprinting Research (variant)
    AdminEMail = ircop@altnet.example
    Network = AltNet

    Listen = 0.0.0.0
    Ports = 6667
    MotdPhrase = "Welcome to the alternate ngIRCd variant."

[LIMITS]
    MaxNickLength = 31
    MaxConnections = 256
    MaxConnectionsIP = 20
    MaxJoins = 50

[OPTIONS]
    PAM = no
    Ident = no
    NoticeBeforeRegistration = yes
    AllowRemoteOper = no
    DNS = no
    MorePrivacy = yes

[CHANNEL]
    Name = #lobby
    Topic = Alternate variant lobby
    Modes = +tns
