# ngircd configuration file
# Lightweight IRC server for protocol fingerprinting

[GLOBAL]
    # Server name and description
    Name = irc.honeypot.local
    AdminInfo1 = Honeypot IRC Server
    AdminInfo2 = Protocol Fingerprinting Research
    AdminEMail = admin@localhost

    # Network configuration
    Listen = 0.0.0.0
    Ports = 6667
    MotdFile = /etc/ngircd/ngircd.motd

[LIMITS]
    MaxNickLength = 15
    MaxConnections = 100
    MaxConnectionsIP = 10

[OPTIONS]
    # Disable PAM authentication for fingerprinting
    PAM = no
    Ident = no
    NoticeBeforeRegistration = no
    AllowRemoteOper = yes
    DNS = no

# Default channels
[CHANNEL]
    Name = #general
    Topic = Protocol fingerprinting research channel
    Modes = +tn

[CHANNEL]
    Name = #test
    Topic = Test channel
    Modes = +tn