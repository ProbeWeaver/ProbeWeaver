[globals]
port=3389
allow_channels=true
max_bpp=32
fork=true

# Negotiate security with a high crypt level so NLA/CredSSP can be negotiated;
# differs from the baseline (crypt_level=none) negotiate behaviour.
security_layer=negotiate
crypt_level=high

[Xvnc]
name=Xvnc
lib=libvnc.so
ip=127.0.0.1
port=5900
username=ask
password=ask
disabled=true
