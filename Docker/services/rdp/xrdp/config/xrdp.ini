# XRDP configuration for honeypot/fingerprinting
# Minimal config - accepts connections for fingerprint detection

[globals]
port=3389
crypt_level=low
allow_channels=true
max_bpp=32
fork=true

# Security settings (minimal for fingerprinting)
security_layer=negotiate
crypt_level=none

# X11 settings
[Xvnc]
name=Xvnc
lib=libvnc.so
ip=127.0.0.1
port=5900
username=ask
password=ask
# Disable actual X server connection
disabled=true

[X11rdp]
name=X11rdp
lib=libxup.so
ip=127.0.0.1
port=6000
username=ask
password=ask
disabled=true