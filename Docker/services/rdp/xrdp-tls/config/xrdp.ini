[globals]
port=3389
allow_channels=true
max_bpp=32
fork=true

# Force TLS security: the negotiation/certificate exchange differs from the
# baseline (negotiate) and rdp-basic variants.
security_layer=tls
crypt_level=high
certificate=
key_file=

[Xvnc]
name=Xvnc
lib=libvnc.so
ip=127.0.0.1
port=5900
username=ask
password=ask
disabled=true
