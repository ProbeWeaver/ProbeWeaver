ServerName            "ProFTPD Server"
ServerType            standalone
DefaultServer         on
Port                  21
UseIPv6               off
UseReverseDNS         off
User                  proftpd
Group                 nogroup
MaxInstances          30
DefaultRoot           ~

<Anonymous /srv/ftp>
  User                ftp
  Group               nogroup
  UserAlias           anonymous ftp
  RequireValidShell   off
  MaxClients          20
  <Limit WRITE>
    DenyAll
  </Limit>
</Anonymous>
