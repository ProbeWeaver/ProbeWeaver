server:
    # Run as root and keep the pidfile/control socket on the /dev/shm tmpfs;
    # the overlay filesystem rejects knot's pidfile creation (EPERM).
    user: root:root
    rundir: "/dev/shm"
    listen: [ "0.0.0.0@53" ]

log:
  - target: stdout
    any: info

database:
    storage: "/var/lib/knot"

zone:
  - domain: example.com.
    file: "/etc/knot/example.com.zone"
