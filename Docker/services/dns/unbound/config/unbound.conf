server:
    interface: 0.0.0.0
    port: 53
    do-ip6: no
    access-control: 0.0.0.0/0 allow
    chroot: ""
    username: ""
    directory: "/etc/unbound"
    verbosity: 1
    hide-identity: no
    hide-version: no

    # Local data so a fingerprinting query gets answered without recursion.
    local-zone: "example.com." static
    local-data: "example.com. IN A 93.184.216.34"
