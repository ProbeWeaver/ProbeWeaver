[global]
   workgroup = WORKGROUP
   server string = Samba NoSign
   security = user
   map to guest = Bad User
   dns proxy = no
   null user = yes
   # Signing disabled, and older dialects allowed down to SMB2.
   server signing = disabled
   server min protocol = SMB2_02
   server max protocol = SMB3_11

[honeypot]
   path = /tmp/samba
   browseable = yes
   read only = yes
   guest ok = yes
   public = yes
   writable = no
