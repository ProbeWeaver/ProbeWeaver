[global]
   workgroup = WORKGROUP
   server string = Samba SMB3
   security = user
   map to guest = Bad User
   dns proxy = no
   null user = yes
   # SMB3 only: refuse SMB1/SMB2 dialects (mimics Windows Server 2019+).
   server min protocol = SMB3_00
   server max protocol = SMB3_11

[honeypot]
   path = /tmp/samba
   browseable = yes
   read only = yes
   guest ok = yes
   public = yes
   writable = no
