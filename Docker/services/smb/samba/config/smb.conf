# Samba configuration for honeypot/fingerprinting
# Minimal share for fingerprint detection

[global]
   workgroup = WORKGROUP
   server string = Samba Server
   security = user
   map to guest = Bad User
   dns proxy = no
   # Allow anonymous access for fingerprinting
   null user = yes

# Minimal share - no real data
[honeypot]
   path = /tmp/samba
   browseable = yes
   read only = yes
   guest ok = yes
   public = yes
   writable = no