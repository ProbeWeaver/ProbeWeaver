[global]
   workgroup = WORKGROUP
   server string = Samba Classic
   security = user
   map to guest = Bad User
   dns proxy = no
   null user = yes
   # Enable the legacy NT1 (SMB1) dialect to mimic older Windows hosts.
   server min protocol = NT1
   server max protocol = SMB3_11
   ntlm auth = yes
   lanman auth = yes

[honeypot]
   path = /tmp/samba
   browseable = yes
   read only = yes
   guest ok = yes
   public = yes
   writable = no
