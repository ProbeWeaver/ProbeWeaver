listener 1883 0.0.0.0
protocol mqtt
accept_protocol_versions 4
allow_anonymous true
persistence false
# Tuned limits change CONNACK behaviour (server keepalive cap, QoS cap).
max_keepalive 120
max_qos 1
max_inflight_messages 10
message_size_limit 1024
log_dest stdout
log_type all
connection_messages true
