config setup
    charondebug="ike 1"

conn %default
    keyexchange=ikev2

conn fingerprint
    # IKEv2 only, restricted proposal set => different SA_INIT proposals/DH group
    # compared with the baseline strongSwan service.
    keyexchange=ikev2
    ike=aes256-sha512-modp3072,aes256gcm16-prfsha384-ecp384!
    left=%any
    right=%any
    authby=psk
    auto=add
