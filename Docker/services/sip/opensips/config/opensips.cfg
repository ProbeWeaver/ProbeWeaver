####### Minimal OpenSIPS 3.4 responder #######
# Replies 200 OK to every received request (e.g. OPTIONS keep-alives) so the
# service is reachable/detectable as a live SIP endpoint advertising
# "Server: OpenSIPS (...)", which differs from Kamailio/Asterisk fingerprints.

log_level=2
log_stderror=yes
auto_aliases=no

socket=udp:0.0.0.0:5060

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
loadmodule "proto_udp.so"
loadmodule "sl.so"

route {
	sl_send_reply(200, "OK");
	exit;
}
