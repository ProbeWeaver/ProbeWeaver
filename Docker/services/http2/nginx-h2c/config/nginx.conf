# Nginx configuration with HTTP/2 cleartext (h2c) support
# For protocol fingerprinting research

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # HTTP/2 cleartext (h2c) server on port 80
    # Supports both HTTP/1.1 upgrade and HTTP/2 direct connection
    server {
        listen 80 http2;
        listen [::]:80 http2;

        server_name _;

        location / {
            root /var/www/html;
            index index.html;
        }
    }
}
