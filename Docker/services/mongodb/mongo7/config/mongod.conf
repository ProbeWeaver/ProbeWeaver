# MongoDB configuration for honeypot/fingerprinting
# Minimal config - bind to all interfaces

# Network
net:
  port: 27017
  bindIp: 0.0.0.0

# Storage (minimal - no persistence needed)
storage:
  dbPath: /var/lib/mongodb

# Logging
systemLog:
  destination: file
  path: /var/log/mongodb/mongodb.log
  logAppend: true
  verbosity: 1

# Security - no auth (for fingerprinting)
security:
  authorization: disabled