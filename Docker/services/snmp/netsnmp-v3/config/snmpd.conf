# SNMPv3 / USM enabled: engine ID + USM users change the v3 fingerprint.
# Also expose a v1/v2c community so the agent is reachable by a basic probe.
rocommunity public
# createUser entries are consumed on first start and moved to persistent state.
createUser authPrivUser SHA "authpass12345" AES "privpass12345"
createUser authOnlyUser SHA "authpass12345"
rouser authPrivUser priv
rouser authOnlyUser auth

# Explicit engine ID so the v3 discovery response is deterministic.
engineID 0x80001f8880fingerprintv3

agentAddress udp:0.0.0.0:161

view systemview included .1
access ro "" any noauth exact systemview none none
