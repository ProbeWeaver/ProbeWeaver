Section "Device"
    Identifier  "dummy"
    Driver      "dummy"
    VideoRam    65536
EndSection

Section "Monitor"
    Identifier  "dummy_monitor"
    HorizSync   28.0-80.0
    VertRefresh 48.0-75.0
EndSection

Section "Screen"
    Identifier  "dummy_screen"
    Device      "dummy"
    Monitor     "dummy_monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1024x768" "1280x1024"
    EndSubSection
EndSection
