bind 0.0.0.0
port 6379
daemonize no
logfile /var/log/redis/redis.log
loglevel notice

# Authentication enabled: unauthenticated commands return NOAUTH, a distinct
# fingerprint from the baseline (no auth).
requirepass fingerprintpass

# Different eviction policy and database count.
maxmemory 128mb
maxmemory-policy volatile-lru
databases 32
save 900 1
appendonly no
