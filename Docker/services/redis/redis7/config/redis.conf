# Redis configuration for honeypot/fingerprinting
# Minimal config - bind to all interfaces, no authentication

bind 0.0.0.0
port 6379
daemonize no
logfile /var/log/redis/redis.log
loglevel notice

# No authentication (for fingerprinting research)
# protected-mode no

# Memory limit
maxmemory 256mb
maxmemory-policy allkeys-lru

# Disable persistence (no data storage needed for fingerprinting)
save ""
appendonly no