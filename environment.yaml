name: protocol_fuzzer
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - numpy>=2.0
  - pyyaml>=6.0
  - pytorch=2.5.1=py3.12_cpu_0
  - pytorch-mutex=1.0=cpu
  - cpuonly=2.0=0
  - blas=*=openblas
  - pip:
      # Mutation, corpus processing, and classifier export.
      - tqdm>=4.65.0
      - ijson>=3.2
      - scikit-learn>=1.3.0
      - scipy>=1.10.0
      - joblib>=1.3.0
      - m2cgen
      - crc32c
      # Optional vector retrieval; lexical retrieval needs no model or API key.
      - llama-index-core>=0.10.0
      - llama-index-embeddings-huggingface
      - llama-index-readers-file
      - sentence-transformers>=2.2.0
      - huggingface-hub
      - transformers>=4.30.0
      - tokenizers>=0.19.0
      - safetensors>=0.4.0
      - pymupdf
      - python-docx>=1.0.0
